name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release-please.yml dispatches CI on its release PR branch: a PR it opens
  # with GITHUB_TOKEN starts no `pull_request` run, so `gate` and the secret
  # scan would never report and the release PR could never merge.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # gitleaks — full-history secret scan on EVERY pull request. It runs at the PR
  # because a secret is the one defect you cannot fix by reverting: once a
  # credential lands in this public history it is burned, and a revert only
  # hides it from HEAD.
  #
  # This runs the free gitleaks CLI, not gitleaks-action. gainratio is an
  # ORGANIZATION, and gitleaks-action refuses to scan an org repo without the
  # GITLEAKS_LICENSE secret. Dependabot runs never get that secret, so every
  # Dependabot PR went red here (#39, #42). The CLI needs no secret and no token.
  #
  # The tarball is pinned by version AND sha256 (from the release's
  # gitleaks_<v>_checksums.txt), so a repointed release asset fails the job.
  # This repo ships no .gitleaks.toml; the default ruleset applies. Findings stay
  # in this job's redacted log.
  gitleaks:
    name: Secret scan / gitleaks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit, so the scan below reaches all of history.
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan full history
        run: |
          commits="$(git rev-list --count --all)"
          gitleaks git --redact --no-banner --log-opts="--all" .
          echo "gitleaks swept FULL HISTORY: all ${commits} commits."

  gate:
    runs-on: ubuntu-latest
    steps:
      # Every `uses:` below names a full 40-char commit SHA, not a moving tag. A tag
      # can be repointed at new code; a SHA cannot. The trailing comment records
      # which release that SHA is, so Dependabot's `github-actions` ecosystem bumps
      # both the pin and the comment. test/workflow-security.test.ts enforces this.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate never pushes, so leaving the token in .git/config would only
          # widen what a compromised step can reach.
          persist-credentials: false

      - name: Install pnpm
        # Version comes from package.json "packageManager" — one pin, no drift.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # pnpm-workspace.yaml names the only dependencies allowed to run builds.
        run: pnpm install --frozen-lockfile

      - name: Gate (the exact local command — CI mirrors the gate)
        run: pnpm gate
