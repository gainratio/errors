name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release-please.yml dispatches CI on its release PR branch: a PR it opens
  # with GITHUB_TOKEN starts no `pull_request` run, so `gate` and the secret
  # scan would never report and the release PR could never merge.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # gitleaks — full-history secret scan on EVERY pull request. It runs at the PR
  # because a secret is the one defect you cannot fix by reverting: once a
  # credential lands in this public history it is burned, and a revert only
  # hides it from HEAD.
  #
  # This job is a faithful inline copy of the job in gainratio/ci's reusable
  # secret-scan.yml at ci-v3.3.0 (8166345), the last release that shipped it:
  # ci retired its reusable catalog (7c75ff1). One addition: gainratio is an
  # ORGANIZATION, and gitleaks-action refuses to scan an org repo without a
  # license, so the action step reads the org secret GITLEAKS_LICENSE.
  #
  # gitleaks-action on its own scans only the commits the event introduced (a
  # push already on main scans zero). The last step adds an explicit pass over
  # every commit. This repo ships no .gitleaks.toml; the default ruleset applies.
  gitleaks:
    name: Secret scan / gitleaks
    # gitleaks-action lists a PR's commits over the API, which needs
    # pull-requests: read. The workflow-level `contents: read` does not grant it.
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Makes BASE^ resolvable for the push/PR range and lets the full-history
          # pass reach every commit. It does NOT by itself widen the action's range.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Findings stay in this job's redacted logs. Never copy a detected
          # credential into a PR comment, summary, or downloadable SARIF artifact.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.30.1"
      - name: Enforce full-history scan coverage
        run: |
          commits="$(git rev-list --count HEAD 2>/dev/null || echo '?')"
          gitleaks git --redact --no-banner --log-opts="--all" .
          echo "gitleaks swept FULL HISTORY: all ${commits} commits."

  gate:
    runs-on: ubuntu-latest
    steps:
      # Every `uses:` below names a full 40-char commit SHA, not a moving tag. A tag
      # can be repointed at new code; a SHA cannot. The trailing comment records
      # which release that SHA is, so Dependabot's `github-actions` ecosystem bumps
      # both the pin and the comment. test/workflow-security.test.ts enforces this.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate never pushes, so leaving the token in .git/config would only
          # widen what a compromised step can reach.
          persist-credentials: false

      - name: Install pnpm
        # Version comes from package.json "packageManager" — one pin, no drift.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # pnpm-workspace.yaml names the only dependencies allowed to run builds.
        run: pnpm install --frozen-lockfile

      - name: Gate (the exact local command — CI mirrors the gate)
        run: pnpm gate
