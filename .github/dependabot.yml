# Weekly, grouped discovery only. Dependabot PRs still require normal review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # gainratio/ci (formerly hseshadr/ci) retired its reusable-workflow catalog
    # (7c75ff1); ci-v3.3.0 is the last release that ships secret-scan.yml and
    # ts-publish.yml. Dependabot otherwise bumps these pins to the default-branch
    # tip, where both files are deleted, and CI fails before any job starts.
    # Move off them deliberately. The hseshadr pattern stays as a guard for any
    # pin still under the old owner.
    ignore:
      - dependency-name: "hseshadr/ci*"
      - dependency-name: "gainratio/ci*"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm-toolchain:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
